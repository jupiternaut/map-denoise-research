[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v28-closeout"
version = "0.1.0"
description = "Frozen V28 geometry and unified selector for closeout confirmation"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.9.0", "joblib==1.6.0", "threadpoolctl==3.6.0"]

[tool.setuptools.package-data]
v28_closeout = ["FEATURE_SCHEMA.json", "models/*.json", "models/*.joblib"]
